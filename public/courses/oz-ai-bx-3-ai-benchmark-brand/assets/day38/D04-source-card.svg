<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><rect width="1000" height="760" fill="#181a29"/><style>text{font-family:Inter,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#eeedf7}.title{font-size:35px;font-weight:600}.body{font-size:25px}.small{font-size:20px;fill:#a5a5b9}.label{font-size:22px;fill:#c6b8fa}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#b6a3eb" stroke-width="1.5"/></marker></defs><text x="50" y="70" class="title">관찰과 내가 예상한 인상을 나눠 기록합니다</text><text x="50" y="112" class="small">실제 고객 인식은 관찰 자료만으로 확정하지 않습니다.</text><rect x="60" y="155" width="880" height="140" rx="12" fill="#222538" stroke="#535267"/><text x="90" y="195" class="label">가상 C01 · 관찰</text><text x="90" y="237" class="body">맛3종 세트 / 비교하며 취향 찾기 안내</text><text x="90" y="274" class="small">원문 위치: 구성·맛 안내 / 이미지 미제공</text><path d="M500 309L500 339" stroke="#b6a3eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="355" width="880" height="290" rx="12" fill="#222538" stroke="#535267"/><text x="90" y="398" class="label">관찰 자료 카드</text><text x="90" y="448" class="small">자료 ID: C01 / 가상 브랜드 A</text><text x="90" y="485" class="small">관찰: 맛의 범주3종, 직접 비교를 권하는 문구</text><text x="90" y="522" class="small">해석: 취향 탐색을 돕는 인상을 줄 수 있음</text><text x="90" y="559" class="small">미확인: 실제로 고르기 쉬운가, 고객이 그렇게 기억하는가?</text><text x="90" y="596" class="small">출처: 가상 자료 / 실제 URL·확인일·이미지 없음</text><text x="50" y="725" class="small">수업용 가상 자료·구조 그림 / 실제 AI 실행·고객 반응이 아닙니다.</text></svg>