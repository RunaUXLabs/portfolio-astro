<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><rect width="1000" height="760" fill="#181a29"/><style>text{font-family:Inter,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#eeedf7} .muted{fill:#a5a5b9} .accent{fill:#c6b8fa} .title{font-size:36px;font-weight:600} .body{font-size:25px} .small{font-size:20px} .label{font-size:21px;fill:#c6b8fa}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#b6a3eb" stroke-width="1.5"/></marker></defs><text x="52" y="70" class="title">과제 결과물을 한 문서에 모읍니다</text><text x="52" y="112" class="small muted">비교표와 가설에서 근거 자료를 다시 찾을 수 있게 만듭니다.</text><rect x="50" y="160" width="360" height="470" rx="12" fill="#222538" stroke="#535267"/><text x="80" y="210" class="label">내 프로젝트 문서</text><text x="80" y="275" class="small">1. 조사 설계·원문 카드</text><text x="80" y="339" class="small">2. 경쟁 비교표</text><text x="80" y="403" class="small">3. 가설 1과 고객 확인 질문</text><text x="80" y="467" class="small">4. 검증 기록</text><text x="80" y="531" class="small">5. AI 사용 기록</text><rect x="475" y="160" width="475" height="125" rx="12" fill="#222538" stroke="#535267"/><text x="505" y="206" class="label">C01~C03 · 원문 근거</text><text x="505" y="249" class="small">위치·URL·확인일을 기록</text><path d="M712 298 L712 326" fill="none" stroke="#b6a3eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="475" y="340" width="475" height="110" rx="12" fill="#222538" stroke="#535267"/><text x="505" y="384" class="body">세 브랜드를 같은 항목으로 비교</text><text x="505" y="420" class="small">각 셀에서 원문으로 돌아가기</text><path d="M712 462 L712 490" fill="none" stroke="#b6a3eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="475" y="505" width="475" height="125" rx="12" fill="#222538" stroke="#535267"/><text x="505" y="549" class="label">가설 1 · 고객의 선택을 도울 방법</text><text x="505" y="590" class="small">생각한 이유와 확인할 질문을 함께 쓰기</text><text x="52" y="723" class="small muted">수업용 구조 그림 · 실서비스 화면이나 실제 AI 실행 결과가 아닙니다.</text></svg>