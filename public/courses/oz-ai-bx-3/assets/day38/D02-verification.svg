<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><rect width="1000" height="760" fill="#181a29"/><style>text{font-family:Inter,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#eeedf7}.title{font-size:35px;font-weight:600}.body{font-size:25px}.small{font-size:20px;fill:#a5a5b9}.label{font-size:22px;fill:#c6b8fa}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#b6a3eb" stroke-width="1.5"/></marker></defs><text x="50" y="70" class="title">있는 구성과 없는 기능을 구별합니다</text><text x="50" y="112" class="small">선택을 돕는 안내를 자동 개인 추천 기능으로 바꾸지 않습니다.</text><rect x="75" y="155" width="850" height="125" rx="12" fill="#222538" stroke="#535267"/><text x="105" y="191" class="label">01 · C01 원문</text><text x="105" y="231" class="body">고소한 맛·산뜻한 맛·진한 맛 3종 세트.</text><text x="105" y="263" class="small">세 가지 맛을 비교하며 내 취향을 찾아보세요.</text><path d="M500 291L500 321" stroke="#b6a3eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="75" y="335" width="850" height="125" rx="12" fill="#222538" stroke="#535267"/><text x="105" y="371" class="label">02 · 잘못된 AI 요약</text><text x="105" y="411" class="body">개인 취향에 맞는 1종을 자동 추천</text><path d="M500 471L500 501" stroke="#b6a3eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="75" y="515" width="850" height="125" rx="12" fill="#222538" stroke="#535267"/><text x="105" y="551" class="label">03 · 대조하고 수정</text><text x="105" y="591" class="body">3종 비교 세트 · 취향 찾기 안내</text><text x="105" y="623" class="small">자동 추천 기능과 실제 선택 도움은 미확인</text><text x="50" y="725" class="small">수업용 가상 자료·구조 그림 / 실제 AI 실행·고객 반응이 아닙니다.</text></svg>