<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><rect width="1000" height="760" fill="#181a29"/><style>text{font-family:Inter,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#eeedf7}.title{font-size:35px;font-weight:600}.body{font-size:25px}.small{font-size:20px;fill:#a5a5b9}.label{font-size:22px;fill:#c6b8fa}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#b6a3eb" stroke-width="1.5"/></marker></defs><text x="50" y="70" class="title">관찰에서 선택에 주는 도움과 브랜드 인상으로</text><text x="50" y="112" class="small">배송·할인·사은품은 약속과의 일관성을 보는 보조 메모입니다.</text><rect x="45" y="170" width="170" height="90" rx="12" fill="#222538" stroke="#535267"/><text x="67" y="222" class="label">맛 설명</text><rect x="230" y="170" width="170" height="90" rx="12" fill="#222538" stroke="#535267"/><text x="252" y="222" class="label">구성</text><rect x="415" y="170" width="170" height="90" rx="12" fill="#222538" stroke="#535267"/><text x="437" y="222" class="label">이미지</text><rect x="600" y="170" width="170" height="90" rx="12" fill="#222538" stroke="#535267"/><text x="622" y="222" class="label">선택 안내</text><rect x="785" y="170" width="170" height="90" rx="12" fill="#222538" stroke="#535267"/><text x="807" y="222" class="label">브랜드 약속</text><path d="M500 278L500 315" stroke="#b6a3eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="140" y="330" width="720" height="105" rx="12" fill="#222538" stroke="#535267"/><text x="180" y="370" class="label">선택에 주는 도움의 해석</text><text x="180" y="413" class="body">무엇을 이해하고, 어떤 기준으로 고르게 하는가?</text><path d="M500 450L500 488" stroke="#b6a3eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="140" y="505" width="720" height="105" rx="12" fill="#222538" stroke="#535267"/><text x="180" y="545" class="label">고객에게 남길 인상에 대한 가설</text><text x="180" y="586" class="body">예: 내 취향 찾기를 돕는 브랜드</text><text x="140" y="663" class="small">실제 선택 도움과 고객 인식은 따로 확인합니다.</text><text x="50" y="725" class="small">수업용 가상 자료·구조 그림 / 실제 AI 실행·고객 반응이 아닙니다.</text></svg>