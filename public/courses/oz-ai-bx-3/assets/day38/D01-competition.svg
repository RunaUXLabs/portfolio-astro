<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><rect width="1000" height="760" fill="#181a29"/><style>text{font-family:Inter,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#eeedf7} .muted{fill:#a5a5b9} .accent{fill:#c6b8fa} .title{font-size:36px;font-weight:600} .body{font-size:25px} .small{font-size:20px} .label{font-size:21px;fill:#c6b8fa}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#b6a3eb" stroke-width="1.5"/></marker></defs><text x="52" y="70" class="title">직접 경쟁과 대체재를 나누는 기준</text><text x="52" y="112" class="small muted">같은 목적을 해결해도 제품 방식과 사용 조건은 다릅니다.</text><rect x="180" y="158" width="640" height="98" rx="12" fill="#222538" stroke="#535267"/><text x="215" y="198" class="label">고객의 선택 상황</text><text x="215" y="235" class="body">집에서 간편하게 커피 한 잔을 마시기</text><path d="M500 266 L500 298" fill="none" stroke="#b6a3eb" stroke-width="2" marker-end="url(#arrow)"/><path d="M205 332V302H795V332" fill="none" stroke="#b6a3eb" stroke-width="2"/><rect x="65" y="338" width="270" height="172" rx="12" fill="#222538" stroke="#535267"/><text x="89" y="386" class="body">드립백 A</text><text x="89" y="432" class="small muted">간편한 커피 한 잔</text><text x="89" y="479" class="label">직접 경쟁</text><rect x="365" y="338" width="270" height="172" rx="12" fill="#222538" stroke="#535267"/><text x="389" y="386" class="body">드립백 B</text><text x="389" y="432" class="small muted">비슷한 제품·구매 상황</text><text x="389" y="479" class="label">직접 경쟁</text><rect x="665" y="338" width="270" height="172" rx="12" fill="#222538" stroke="#535267"/><text x="689" y="386" class="body">캡슐 커피</text><text x="689" y="432" class="small muted">다른 방식으로 목적 해결</text><text x="689" y="479" class="label">대체재</text><text x="78" y="575" class="body">비교의 중심: 같은 고객·같은 상황의 드립백 브랜드</text><text x="78" y="619" class="small muted">캡슐은 머신 보유 여부 등 조건을 확인한 뒤 포함합니다.</text><text x="52" y="723" class="small muted">수업용 구조 그림 · 실서비스 화면이나 실제 AI 실행 결과가 아닙니다.</text></svg>